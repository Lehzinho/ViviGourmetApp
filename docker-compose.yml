services:
  postgres:
    image: postgres:15-alpine
    container_name: vivi-gourmet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivi
      POSTGRES_PASSWORD: vivi
      POSTGRES_DB: vivi_gourmet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivi -d vivi_gourmet"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vivi-gourmet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vivigourmet.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
